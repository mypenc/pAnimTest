name: Anim check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check and test
        run: |
          set -o pipefail
          {
            cargo check -p photocraft-web --target wasm32-unknown-unknown --message-format short &&
            cargo test -p photocraft-engine --lib -- timeline_cmds avi &&
            cargo test -p photocraft-ui-egui --lib
          } 2>&1 | tee out.txt
      - name: Report errors
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo '```'; grep -E "error|panicked|FAILED|failed" out.txt | head -40 | cut -c1-300; echo '```'; } > body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@body.md
